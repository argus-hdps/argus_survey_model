[project]
name = "argus_sim"
version = "0.1.0"
description = "Survey simulator for the Argus Array: pointing, sky background, depth and light curves"
keywords = ["astronomy", "survey simulation", "time-domain astronomy", "light curves", "Argus Array"]
authors = [
    {name = "Hank Corbett", email = "htc@unc.edu"},
]
dependencies = [
    "mocpy>=0.13.1",
    "scipy>=1.12.0",
    "click>=8.1.7",
    "tosholi>=0.1.0",
    "pandas>=2.2.1",
    "astroplan>=0.9.1",
    "numba>=0.60.0",
    "astropy>=6.0.1",
    "numpy-quaternion>=2023.0.4",
    "astropy-healpix>=1.0.3",
    "healpy>=1.17.3",
    "healsparse>=1.6",
    "sncosmo>=2.12.1",
    "pyarrow>=15.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_sim"]

[dependency-groups]
dev = [
    "sphinx>=7.4.7",
    "sphinx-copybutton>=0.5.2",
    "ruff>=0.6.8",
    "furo>=2024.8.6",
    "sphinx-automodapi>=0.18.0",
    "ipython>=8.18.1",
    "ipykernel>=6.29.5",
    "ipympl>=0.9.4",
    "hypothesis>=6.0",
    "pytest>=7.0",
    "jupyter>=1.1.1",
    "moto[server]>=5.0",
]

[project.scripts]
asim = "argus_sim.cli:main"

[project.optional-dependencies]
gpu = [
    "cupy-cuda13x>=14.2 ; python_full_version >= '3.10'",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow-running",
    "gpu: marks tests requiring GPU/CUDA",
    "integration: marks integration tests",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "docs",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "tests",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "*.ipynb",
]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]
ignore = ["D203", "D213"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

